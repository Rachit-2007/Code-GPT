<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Login | Code-GPT</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="login-container">

    <div class="logo">

        <i class="fa-solid fa-robot"></i>

        <h1>Code-GPT</h1>

    </div>

    <h2>Welcome Back</h2>

    <p>Login to continue using Code-GPT</p>

    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">

            Login

        </button>

    </form>

    <div class="bottom-text">

        Don't have an account?

        <a href="{% url 'register' %}">

            Register

        </a>

    </div>

</div>

</body>

</html>
