{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register | Code-GPT</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="login-container">

    <div class="logo">
        <i class="fa-solid fa-robot"></i>
        <h1>Code-GPT</h1>
    </div>

    <h2>Create Account</h2>

    <p>Create your Code-GPT account</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <div class="bottom-text">

        Already have an account?

        <a href="{% url 'login' %}">

            Login

        </a>

    </div>

</div>

</body>
</html>
